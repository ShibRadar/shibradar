name: ShibRadar Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = only print, false = publish on Threads)"
        type: choice
        options: ["true", "false"]
        default: "true"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: shibradar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          # Manual run: the chosen input. Scheduled run: repository
          # variable DRY_RUN (Settings > Variables). Default: true.
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
        run: python -m src.main
      - name: Save state
        if: always()
        run: |
          git config user.name "ShibRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          # state.json and the encrypted, self-renewed Threads token.
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "bot: update state"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep 10
          done
          exit 1
